    function formatDateForDisplay(dateString) {
      if (!dateString) return "";
      const parts = dateString.split("-");
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return dateString;
    }

    function formatDateForInput(value) {
      if (!value) return "";
      if (value.includes("/")) {
        const [d, m, y] = value.split("/");
        return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
      }
      if (/^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
      if (/^\d{2}-\d{2}-\d{4}$/.test(value)) {
        const [d, m, y] = value.split("-");
        return `${y}-${m}-${d}`;
      }
      return value;
    }

    function formatDateToDDMMYYYY(value) {
      if (!value) return "";
      if (value.includes("-")) {
        const [y, m, d] = value.split("-");
        return `${d}-${m}-${y}`;
      }
      return value;
    }

    function isValidDateDDMMYYYY(value) {
      if (!/^\d{2}-\d{2}-\d{4}$/.test(value)) return false;
      const [d, m, y] = value.split("-").map(Number);
      if (y < 1900 || y > 2100 || m < 1 || m > 12) return false;
      const monthLength = [31, 28 + (y % 400 === 0 || (y % 100 !== 0 && y % 4 === 0) ? 1 : 0), 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
      return d > 0 && d <= monthLength[m - 1];
    }

    function calculateEndDate(startDate, duration, unit) {
      if (!startDate || !duration || !unit) return undefined;
      const [y, m, d] = startDate.split("-").map(Number);
      const date = new Date(Date.UTC(y, m - 1, d));
      if (isNaN(date)) return undefined;
      switch (unit) {
        case "días":
          date.setUTCDate(date.getUTCDate() + duration);
          break;
        case "semanas":
          date.setUTCDate(date.getUTCDate() + duration * 7);
          break;
        case "meses":
          date.setUTCMonth(date.getUTCMonth() + duration);
          break;
        case "años":
          date.setUTCFullYear(date.getUTCFullYear() + duration);
          break;
        default:
          break;
      }
      return date.toISOString().split("T")[0];
    }

    function useLocalStorage(key, initialValue) {
      const [value, setValue] = useState(() => {
        try {
          const stored = window.localStorage.getItem(key);
          return stored ? JSON.parse(stored) : initialValue;
        } catch {
          return initialValue;
        }
      });
      useEffect(() => {
        window.localStorage.setItem(key, JSON.stringify(value));
      }, [key, value]);
      return [value, setValue];
    }

    function calculateStandings(matches, clubs, allDivisions, liguillaGroups, forLiguilla) {
      const finished = matches.filter((m) => (forLiguilla ? m.estado === "Completado" : m.estado === "Finalizado") && m.resultado);
      const standings = forLiguilla ? {} : { general: {}, byDivision: {} };
      if (forLiguilla) {
        LIGUILLA_GROUPS.forEach((group) => {
          standings[group] = {};
          allDivisions.forEach((div) => {
            standings[group][div] = {};
          });
        });
      } else {
        clubs.forEach((club) => {
          standings.general[club.nombre] = { club: club.nombre, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0, pts: 0 };
          allDivisions.forEach((division) => {
            if (!standings.byDivision[division]) standings.byDivision[division] = {};
            if (club.divisiones.includes(division)) {
              standings.byDivision[division][club.nombre] = { club: club.nombre, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0, pts: 0 };
            }
          });
        });
      }
      finished.forEach((match) => {
        const [gLS, gVS] = match.resultado.split("-").map(Number);
        if (Number.isNaN(gLS) || Number.isNaN(gVS)) return;
        const loc = match.local;
        const vis = match.visitante;
        const div = match.division;
        const grp = match.grupo;
        const tables = [];
        if (forLiguilla) {
          if (standings[grp] && standings[grp][div]) {
            if (!standings[grp][div][loc]) standings[grp][div][loc] = { club: loc, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0, pts: 0 };
            if (!standings[grp][div][vis]) standings[grp][div][vis] = { club: vis, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0, pts: 0 };
            tables.push(standings[grp][div]);
          }
        } else {
          tables.push(standings.general);
          if (standings.byDivision[div]) tables.push(standings.byDivision[div]);
        }
        tables.forEach((table) => {
          const home = table[loc] || { club: loc, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0, pts: 0 };
          const away = table[vis] || { club: vis, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0, pts: 0 };
          home.pj++;
          away.pj++;
          home.gf += gLS;
          away.gf += gVS;
          home.gc += gVS;
          away.gc += gLS;
          if (gLS > gVS) {
            home.pg++;
            away.pp++;
            home.pts += 3;
          } else if (gVS > gLS) {
            away.pg++;
            home.pp++;
            away.pts += 3;
          } else {
            home.pe++;
            away.pe++;
            home.pts += 1;
            away.pts += 1;
          }
          home.dif = home.gf - home.gc;
          away.dif = away.gf - away.gc;
          table[loc] = home;
          table[vis] = away;
        });
      });

          });

        }, {});

        general: Object.values(standings.general).sort(sort),
        byDivision: allDivisions.reduce((acc, division) => {

                  React.createElement("button", {

              React.createElement("div", null,

                React.createElement("select", {

              React.createElement("button", { type: "submit", className: "bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md" }, "Guardar Usuario")

                      React.createElement("td", { className: "px-4 py-2 font-medium text-gray-900 dark:text-slate-200 whitespace-nowrap" }, user.nombre),
                      React.createElement("td", { className: "px-4 py-2 dark:text-slate-300" }, user.cedula),
                      React.createElement("td", { className: "px-4 py-2 dark:text-slate-300" }, user.rol),
                      React.createElement("td", { className: "px-4 py-2 text-center space-x-1 whitespace-nowrap" },
                        React.createElement("button", { onClick: () => { setEditingUser(user); setFormVisible(true); }, className: "edit-user-btn bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 text-gray-700 dark:text-slate-300 text-xs font-medium p-1.5 rounded inline-flex items-center justify-center" }, React.createElement(Icon.Pencil, null)),
                        React.createElement("button", { onClick: () => onDeleteUser(user.id), className: "delete-user-btn bg-red-100 dark:bg-red-900/30 hover:bg-red-200 dark:hover:bg-red-800/50 text-red-700 dark:text-red-400 text-xs font-medium p-1.5 rounded inline-flex items-center justify-center" }, React.createElement(Icon.Trash, null))
                      )

    function renderUserInput(label, name, form, setForm, type = "text", placeholder = "", disabled = false) {
      return React.createElement("div", null,

        React.createElement("input", {

          value: form[name] || "",
          placeholder,
          disabled,
          onChange: (e) => setForm({ ...form, [name]: e.target.value }),
          className: `w-full px-3 py-2 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-md ${disabled ? "opacity-70 cursor-not-allowed" : ""}`,
        })
      );
    }

    function App() {
      const [isAuthenticated, setAuthenticated] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginError, setLoginError] = useState("");
      const [activeSection, setActiveSection] = useState("inicio-section");
      const [isSidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [isDarkMode, setDarkMode] = useLocalStorage("darkMode", false);
      const [clubs, setClubs] = useState([...INITIAL_CLUBS]);
      const [players, setPlayers] = useState([...INITIAL_PLAYERS]);
      const [matches, setMatches] = useState([...INITIAL_MATCHES]);
      const [liguillaMatches, setLiguillaMatches] = useState([...INITIAL_LIGUILLA_MATCHES]);
      const [suspensions, setSuspensions] = useState([...INITIAL_SUSPENSIONS]);
      const [users, setUsers] = useState([...INITIAL_USERS]);
      const [liguillaGroups, setLiguillaGroups] = useState(() => {
        const grouping = {};
        INITIAL_LIGUILLA_MATCHES.forEach((match) => {
          const local = groupsFind(match.local);
          const visit = groupsFind(match.visitante);
          if (local) grouping[local.id] = match.grupo;
          if (visit) grouping[visit.id] = match.grupo;
        });
        INITIAL_CLUBS.forEach((club) => {
          if (!grouping[club.id]) grouping[club.id] = null;
        });
        return grouping;
      });
      const [associationDetails, setAssociationDetails] = useState({ ...INITIAL_ASSOCIATION_DETAILS });
      const [activeLiguillaDivisionTab, setActiveLiguillaDivisionTab] = useState(ALL_DIVISIONES.find((d) => d.includes("infantil")) || ALL_DIVISIONES[0]);
      const [activeLiguillaGroupTab, setActiveLiguillaGroupTab] = useState(LIGUILLA_GROUPS[0]);
      const [selectedImportFileName, setSelectedImportFileName] = useState("");
      const [exportOptions, setExportOptions] = useState({ jugadores: false, clubes: false, tablaPosiciones: false, suspensiones: false });

      useEffect(() => {
        document.documentElement.classList.toggle("dark", isDarkMode);
      }, [isDarkMode]);

      function groupsFind(name) {
        return INITIAL_CLUBS.find((club) => club.nombre === name);
      }

      function handleLogin(cedula, password) {
        const user = users.find((u) => u.cedula === cedula);
        if (user && user.password === password) {
          setAuthenticated(true);
          setCurrentUser(user);
          setLoginError("");
          setActiveSection("inicio-section");
        } else {
          setLoginError("Cédula o contraseña incorrecta.");
        }
      }

      function handleLogout() {
        setAuthenticated(false);
        setCurrentUser(null);
        setActiveSection("inicio-section");
      }

      function handleSaveClub(club) {
        if (club.id) {
          setClubs((prev) => prev.map((item) => (item.id === club.id ? { ...item, ...club } : item)));
        } else {
          setClubs((prev) => [...prev, { ...club, id: prev.length + 1 }]);
        }
      }

      function handleDeleteClub(id) {
        setClubs((prev) => prev.filter((club) => club.id !== id));
      }

      function handleSavePlayer(player) {
        if (players.some((p) => p.id === player.id)) {
          setPlayers((prev) => prev.map((item) => (item.id === player.id ? { ...item, ...player } : item)));
        } else {
          setPlayers((prev) => [...prev, { ...player, id: player.cedula }]);
        }
      }

      function handleDeletePlayer(playerId) {
        setPlayers((prev) => prev.filter((player) => player.id !== playerId));
      }

      function handleSaveMatch(match) {
        if (match.id) {
          setMatches((prev) => prev.map((item) => (item.id === match.id ? { ...item, ...match } : item)));
        } else {
          setMatches((prev) => [...prev, { ...match, id: Date.now(), estado: "Pendiente", resultado: "" }]);
        }
      }

      function handleDeleteMatch(id) {
        setMatches((prev) => prev.filter((match) => match.id !== id));
      }

      function handleRegisterResult(matchId) {
        const localScore = Number(document.querySelector(`.result-input.local-score[data-match-id=\"${matchId}\"]`)?.value);
        const visitorScore = Number(document.querySelector(`.result-input.visitor-score[data-match-id=\"${matchId}\"]`)?.value);
        if (Number.isNaN(localScore) || Number.isNaN(visitorScore)) return;
        setMatches((prev) => prev.map((match) => (match.id === matchId ? { ...match, resultado: `${localScore}-${visitorScore}`, estado: "Finalizado" } : match)));
      }

      function handleSaveLiguillaMatch(match) {
        if (match.id) {
          setLiguillaMatches((prev) => prev.map((item) => (item.id === match.id ? { ...item, ...match } : item)));
        } else {
          setLiguillaMatches((prev) => [...prev, { ...match, id: Date.now() + 100000, estado: "Pendiente", resultado: "" }]);
        }
      }

      function handleDeleteLiguillaMatch(id) {
        setLiguillaMatches((prev) => prev.filter((match) => match.id !== id));
      }

      function handleRegisterLiguillaResult(matchId) {
        const localScore = Number(document.querySelector(`#root .result-input.local-score[data-match-id=\"${matchId}\"]`)?.value);
        const visitorScore = Number(document.querySelector(`#root .result-input.visitor-score[data-match-id=\"${matchId}\"]`)?.value);
        if (Number.isNaN(localScore) || Number.isNaN(visitorScore)) return;
        setLiguillaMatches((prev) => prev.map((match) => (match.id === matchId ? { ...match, resultado: `${localScore}-${visitorScore}`, estado: "Completado" } : match)));
      }

      function handleAssignClubToGroup(clubId, group) {
        setLiguillaGroups((prev) => ({ ...prev, [clubId]: group }));
      }

      function handleRemoveClubFromGroup(clubId) {
        setLiguillaGroups((prev) => ({ ...prev, [clubId]: null }));
      }

      function handleSaveLiguillaGroups() {
        alert("Grupos de liguilla guardados (simulado).\n" + JSON.stringify(liguillaGroups, null, 2));
      }

      function handleSaveSuspension(suspension) {
        if (suspension.id && suspensions.some((s) => s.id === suspension.id)) {
          setSuspensions((prev) => prev.map((item) => (item.id === suspension.id ? suspension : item)));
        } else {
          setSuspensions((prev) => [...prev, suspension]);
        }
      }

      function handleDeleteSuspension(id) {
        setSuspensions((prev) => prev.filter((s) => s.id !== id));
      }

      function handleImportFileChange(file) {
        setSelectedImportFileName(file ? file.name : "");
      }

      function handleImportData() {
        alert(`Importar archivo \"${selectedImportFileName}\" (Funcionalidad no implementada).`);
      }

      function handleExportData() {
        const selected = Object.entries(exportOptions).filter(([_, value]) => value).map(([key]) => key);
        if (selected.length === 0) {
          alert("Selecciona datos para exportar.");
          return;
        }
        alert(`Exportando: ${selected.join(", ")} (Funcionalidad no implementada)`);
      }

      function toggleExportOption(key) {
        setExportOptions((prev) => ({ ...prev, [key]: !prev[key] }));
      }

      function handleSaveUser(user) {
        if (user.id && users.some((u) => u.id === user.id)) {
          setUsers((prev) => prev.map((item) => (item.id === user.id ? { ...item, ...user, password: user.password || item.password } : item)));
        } else {
          setUsers((prev) => [...prev, { ...user, id: user.cedula }]);
        }
      }

      function handleDeleteUser(userId) {
        if (userId === MASTER_ADMIN_ID) {
          alert("No se puede eliminar al Admin Maestro.");
          return;
        }
        setUsers((prev) => prev.filter((user) => user.id !== userId));
      }

      function handleSaveAssociation(newDetails) {
        setAssociationDetails(newDetails);
      }

      return isAuthenticated
        ? React.createElement("div", { className: "flex h-screen" },
            React.createElement(Sidebar, {
              activeSection,
              collapsed: isSidebarCollapsed,
              onToggle: () => setSidebarCollapsed(!isSidebarCollapsed),
              onNavigate: (section) => {
                if (section === "logout") {
                  handleLogout();
                } else {
                  setActiveSection(section);
                }
              },
              associationDetails,
            }),
            React.createElement("div", { className: "flex-1 flex flex-col overflow-hidden bg-gray-100 dark:bg-slate-900" },
              React.createElement(Header, { user: currentUser, darkMode: isDarkMode, onToggleDarkMode: () => setDarkMode(!isDarkMode) }),
              React.createElement("main", { className: "flex-1 overflow-x-hidden overflow-y-auto p-6" },
                React.createElement(RenderSection, {
                  sectionId: activeSection,
                  appState: {
                    matches,
                    clubs,
                    players,
                    liguillaMatches,
                    suspensions,
                    users,
                    associationDetails,
                    liguillaGroups,
                    activeLiguillaDivisionTab,
                    activeLiguillaGroupTab,
                    selectedImportFileName,
                    exportOptions,
                  },
                  actions: {
                    saveAssociation: handleSaveAssociation,
                    saveClub: handleSaveClub,
                    deleteClub: handleDeleteClub,
                    savePlayer: handleSavePlayer,
                    deletePlayer: handleDeletePlayer,
                    saveMatch: handleSaveMatch,
                    deleteMatch: handleDeleteMatch,
                    registerResult: handleRegisterResult,
                    saveLiguillaMatch: handleSaveLiguillaMatch,
                    deleteLiguillaMatch: handleDeleteLiguillaMatch,
                    registerLiguillaResult: handleRegisterLiguillaResult,
                    assignClubToGroup: handleAssignClubToGroup,
                    removeClubFromGroup: handleRemoveClubFromGroup,
                    saveLiguillaGroups: handleSaveLiguillaGroups,
                    setLiguillaDivisionTab: setActiveLiguillaDivisionTab,
                    setLiguillaGroupTab: setActiveLiguillaGroupTab,
                    saveSuspension: handleSaveSuspension,
                    deleteSuspension: handleDeleteSuspension,
                    setImportFileName: (file) => handleImportFileChange(file),
                    importData: handleImportData,
                    exportData: handleExportData,
                    toggleExportOption,
                    saveUser: handleSaveUser,
                    deleteUser: handleDeleteUser,
                  },
                })
              )
            )
          )
        : React.createElement(LoginScreen, { onLogin: handleLogin, error: loginError, associationDetails });
    }

    function LoginScreen({ onLogin, error, associationDetails }) {
      const [cedula, setCedula] = useState("");
      const [password, setPassword] = useState("");
      return React.createElement("div", { className: "flex items-center justify-center min-h-screen bg-gray-100 dark:bg-slate-900" },
        React.createElement("div", { className: "bg-white dark:bg-slate-800 p-8 rounded-lg shadow-md w-full max-w-sm" },
          React.createElement("img", {
            src: associationDetails.logoUrl,
            alt: "Logo Asociación",
            className: "mx-auto mb-4 h-36 w-auto object-contain",
            onError: (e) => {
              e.currentTarget.onerror = null;
              e.currentTarget.src = "https://placehold.co/144x144/cccccc/ffffff?text=Logo";
            },
          }),
          React.createElement("h2", { className: "text-2xl font-bold text-center mb-6 text-gray-800 dark:text-slate-200" }, "Bienvenido"),
          error && React.createElement("p", { className: "text-red-500 text-sm text-center mb-4" }, error),
          React.createElement("form", {
            onSubmit: (e) => {
              e.preventDefault();
              onLogin(cedula, password);
            },
          },
            React.createElement("div", { className: "mb-4" },
              React.createElement("label", { className: "block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1", htmlFor: "loginCedula" }, "Cédula"),
              React.createElement("input", {
                id: "loginCedula",
                value: cedula,
                onChange: (e) => setCedula(e.target.value),
                required: true,
                placeholder: "12345678-9",
                className: "w-full px-3 py-2 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500",
              })
            ),
            React.createElement("div", { className: "mb-6" },
              React.createElement("label", { className: "block text-sm font-medium text-gray-700 dark:text-slate-300 mb-1", htmlFor: "loginPassword" }, "Contraseña"),
              React.createElement("input", {
                id: "loginPassword",
                type: "password",
                value: password,
                onChange: (e) => setPassword(e.target.value),
                required: true,
                className: "w-full px-3 py-2 border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-slate-200 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500",
              })
            ),
            React.createElement("button", { type: "submit", className: "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" }, "Iniciar Sesión")
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
